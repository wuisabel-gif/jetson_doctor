<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jetson Doctor — Diagnostic Report Demo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,sans-serif;
  background:#06080c;color:#e9edf3;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

/* Header: brand only */
.topbar{display:flex;align-items:center;gap:10px;padding:14px 22px;
  background:#0e1116;border-bottom:1px solid #232a35}
.brand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:500}
.brand .dot{width:10px;height:10px;border-radius:50%;background:#76b900;box-shadow:0 0 10px #76b900}
.brand small{color:#69727f;font-weight:400;font-size:12.5px}

/* Dedicated scenario selector section */
.selector{padding:16px 22px;background:#0b0e13;border-bottom:1px solid #1b212b}
.sel-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:11px}
.sel-title{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#9aa6b6;font-weight:500}
.sel-sub{font-size:12.5px;color:#69727f}
.tabs{display:flex;flex-wrap:wrap;gap:10px}
.tab{display:flex;align-items:center;gap:9px;padding:10px 16px;border-radius:10px;
  border:1px solid #2a323f;background:#161c25;color:#cfd6e0;font-size:13.5px;font-family:inherit;
  cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.3);
  transition:border-color .15s,background .15s,color .15s,transform .1s}
.tab:hover{border-color:#3a4554;background:#1b2230;color:#fff;transform:translateY(-1px)}
.tab:active{transform:translateY(0)}
.tab:focus-visible{outline:2px solid #76b900;outline-offset:2px}
.tab .led{width:9px;height:9px;border-radius:50%;background:var(--c);
  box-shadow:0 0 8px color-mix(in srgb,var(--c) 70%,transparent)}
.tab .badge{font-size:10.5px;letter-spacing:.04em;font-weight:500;color:var(--c)}
.tab[aria-selected="true"]{color:#fff;
  border-color:color-mix(in srgb,var(--c) 65%,transparent);
  background:color-mix(in srgb,var(--c) 16%,transparent);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 35%,transparent)}

/* Active-scenario hint */
.hint{padding:9px 22px;font-size:12.5px;color:#9aa6b6;background:#0e1116;border-bottom:1px solid #1b212b}
.hint b{color:#e9edf3;font-weight:500}

.frame{flex:1 1 auto;width:100%;border:0;min-height:0;background:#06080c}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="dot"></span>Jetson Doctor <small>— diagnostic report demo</small></div>
</header>

<section class="selector" aria-label="Scenario selector">
  <div class="sel-head">
    <span class="sel-title">Select a scenario</span>
    <span class="sel-sub">Click a button to compare how the report responds across health states.</span>
  </div>
  <div class="tabs" role="tablist" aria-label="Demo scenarios">
    <button class="tab" role="tab" data-src="healthy.html"   data-desc="All sensors nominal." style="--c:#56d364"><span class="led"></span>Healthy <span class="badge">PASS</span></button>
    <button class="tab" role="tab" data-src="warning.html"   data-desc="Disk usage above the recommended threshold." style="--c:#e3b341"><span class="led"></span>Warning <span class="badge">WARN</span></button>
    <button class="tab" role="tab" data-src="critical.html"  data-desc="Thermal and resource crisis; CPU throttling." style="--c:#f85149"><span class="led"></span>Critical <span class="badge">FAIL</span></button>
    <button class="tab" role="tab" data-src="nonjetson.html" data-desc="Generic Linux host with no thermal sensors." style="--c:#768390"><span class="led"></span>Non-Jetson <span class="badge">UNKNOWN</span></button>
  </div>
</section>

<div class="hint" id="hint"></div>
<iframe class="frame" id="frame" title="Jetson Doctor diagnostic report" src="warning.html"></iframe>
<script>
(function(){
  var tabs=Array.prototype.slice.call(document.querySelectorAll('.tab'));
  var frame=document.getElementById('frame');
  var hint=document.getElementById('hint');
  function select(tab){
    tabs.forEach(function(t){t.setAttribute('aria-selected', t===tab?'true':'false');});
    frame.src=tab.getAttribute('data-src');
    hint.innerHTML='<b>'+tab.textContent.trim().replace(/\s+/g,' ')+'</b> — '+tab.getAttribute('data-desc');
  }
  tabs.forEach(function(t){t.addEventListener('click',function(){select(t);});});
  select(tabs[1]);
})();
</script>
</body>
</html>
