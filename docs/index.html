<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jetson Doctor — Diagnostic Report Demo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,sans-serif;
  background:#06080c;color:#e9edf3;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:13px 20px;
  background:#0e1116;border-bottom:1px solid #232a35;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:500}
.brand .dot{width:10px;height:10px;border-radius:50%;background:#76b900;box-shadow:0 0 10px #76b900}
.brand small{color:#69727f;font-weight:400;font-size:12.5px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
.tab{display:flex;align-items:center;gap:8px;padding:7px 13px;border-radius:8px;
  border:1px solid #232a35;background:#151a21;color:#9aa6b6;font-size:13px;font-family:inherit;
  cursor:pointer;transition:border-color .15s,background .15s,color .15s}
.tab:hover{border-color:#2e3744;color:#e9edf3}
.tab:focus-visible{outline:2px solid #76b900;outline-offset:2px}
.tab .led{width:8px;height:8px;border-radius:50%;background:var(--c)}
.tab .badge{font-size:10.5px;letter-spacing:.04em;color:var(--c)}
.tab[aria-selected="true"]{color:#e9edf3;
  border-color:color-mix(in srgb,var(--c) 55%,transparent);
  background:color-mix(in srgb,var(--c) 13%,transparent)}
.hint{padding:8px 20px;font-size:12.5px;color:#9aa6b6;background:#0e1116;border-bottom:1px solid #1b212b}
.hint b{color:#e9edf3;font-weight:500}
.frame{flex:1 1 auto;width:100%;border:0;min-height:0;background:#06080c}
</style>
</head>
<body>
<div class="bar">
  <div class="brand"><span class="dot"></span>Jetson Doctor <small>— diagnostic report demo</small></div>
  <div class="tabs" role="tablist" aria-label="Demo scenarios">
    <button class="tab" role="tab" data-src="healthy.html"   data-desc="All sensors nominal." style="--c:#56d364"><span class="led"></span>Healthy <span class="badge">PASS</span></button>
    <button class="tab" role="tab" data-src="warning.html"   data-desc="Disk usage above the recommended threshold." style="--c:#e3b341"><span class="led"></span>Warning <span class="badge">WARN</span></button>
    <button class="tab" role="tab" data-src="critical.html"  data-desc="Thermal and resource crisis; CPU throttling." style="--c:#f85149"><span class="led"></span>Critical <span class="badge">FAIL</span></button>
    <button class="tab" role="tab" data-src="nonjetson.html" data-desc="Generic Linux host with no thermal sensors." style="--c:#768390"><span class="led"></span>Non-Jetson <span class="badge">UNKNOWN</span></button>
  </div>
</div>
<div class="hint" id="hint"></div>
<iframe class="frame" id="frame" title="Jetson Doctor diagnostic report" src="warning.html"></iframe>
<script>
(function(){
  var tabs=Array.prototype.slice.call(document.querySelectorAll('.tab'));
  var frame=document.getElementById('frame');
  var hint=document.getElementById('hint');
  function select(tab){
    tabs.forEach(function(t){t.setAttribute('aria-selected', t===tab?'true':'false');});
    frame.src=tab.getAttribute('data-src');
    hint.innerHTML='<b>'+tab.textContent.trim().replace(/\s+/g,' ')+'</b> — '+tab.getAttribute('data-desc');
  }
  tabs.forEach(function(t){t.addEventListener('click',function(){select(t);});});
  select(tabs[1]);
})();
</script>
</body>
</html>
